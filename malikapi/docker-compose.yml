version: '3.8'

services:
  # FastAPI сервер (основное приложение)
  api:
    build: .
    container_name: replication-api
    ports:
      - "8000:8000"
    volumes:
      - ./configs:/app/configs:ro          # монтируем конфиги (только чтение)
      - ./users.json:/app/users.json        # сохраняем пользователей
      - ./uuids.txt:/app/uuids.txt          # сохраняем uuid
    environment:
      - PYTHONPATH=/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  # Streamlit UI для мониторинга
  ui:
    build: .
    container_name: replication-ui
    ports:
      - "8501:8501"
    volumes:
      - ./configs:/app/configs:ro
    environment:
      - PYTHONPATH=/app
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    restart: unless-stopped

